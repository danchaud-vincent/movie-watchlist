<!doctype html>
<html>
  <head>
    <!-- META -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Watchlist</title>

    <!-- FONT AWESOME -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- GOOGLE FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- STYLESHEET -->
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/article.css" />
  </head>
  <body>
    <header id="hero" class="hero">
      <div class="hero-content wrapper">
        <h1>Article</h1>
        <nav class="navbar">
          <ul>
            <li><a href="index.html">Search for a movie</a></li>
            <li><a href="watchlist.html">My Watchlist</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <main>
      <article class="movie-article wrapper">
        <section class="movie-container" id="movie-container" data-movie-id="">
          <div class="movie-link">
            <img id="movie-poster" class="movie-poster" alt="movie poster" src="" />
          </div>

          <div class="movie-content">
            <div class="movie-header">
              <h2 id="movie-title"></h2>
            </div>
            <div class="movie-description">
              <p class="no-shrink" id="movie-rating">⭐</p>
              <p class="no-shrink" id="movie-duration"></p>
            </div>
            <div class="movie-genres" id="movie-genres"></div>
            <button class="watchlist-btn" id="movie-watchlist"></button>
            <div class="movie-plot">
              <span class="plot-text" data-truncated="false" data-fulltext="" id="movie-plot"></span>
              <button class="readmore-btn"></button>
            </div>
          </div>
        </section>
        <section class="container links-section">
          <a href="#director" class="link-section">Director</a>
          <a href="#distribution" class="link-section">Distribution</a>
          <a href="#awards" class="link-section">Awards</a>
        </section>
        <section id="directors" class="container">
          <h2>Director</h2>
        </section>
        <section id="distribution" class="container">
          <h2>Distribution</h2>
          <div id="movie-actors" class="actors-container"></div>
        </section>
        <section id="awards" class="container">
          <h2>Awards & BoxOffice</h2>
        </section>
      </article>
    </main>
    <script src="./js/pages/article.js" type="module"></script>
  </body>
</html>
